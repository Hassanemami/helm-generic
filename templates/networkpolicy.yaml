{{- if (.Values.networkPolicy).enabled }}
{{- $np := .Values.networkPolicy }}
{{- $podSelector := merge (dict) (include "application.selectorLabels" . | fromYaml) (.Values.deployment.podLabels | default dict) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  {{- include "application.metadata" (dict "context" $ "name" (include "application.name" .) "labels" $np.additionalLabels "annotations" $np.annotations) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml $podSelector | nindent 6 }}
  {{- if or $np.ingress $np.egress }}
  policyTypes:
    {{- if $np.ingress }}
    - Ingress
    {{- end }}
    {{- if $np.egress }}
    - Egress
    {{- end }}
  {{- end }}
  {{- with $np.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $np.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
