{{- if (.Values.httpRoute).enabled }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") }}
  {{- fail "There is no APIGateway resource definition in the target cluster!" }}
{{- end }}
{{- $route := .Values.httpRoute }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- include "application.metadata" (dict "context" $ "name" (include "application.name" .) "labels" $route.additionalLabels "annotations" $route.annotations) | nindent 2 }}
spec:
  parentRefs:
    {{- include "application.tplvalues.render" (dict "value" $route.parentRefs "context" $) | nindent 4 }}
  {{- with $route.useDefaultGateways }}
  useDefaultGateways: {{ . }}
  {{- end }}
  hostnames:
    {{- include "application.tplvalues.render" (dict "value" $route.hostnames "context" $) | nindent 4 }}
  rules:
    {{- include "application.tplvalues.render" (dict "value" $route.rules "context" $) | nindent 4 }}
{{- end }}
