{{- if and (.Values.secretProviderClass).enabled (.Capabilities.APIVersions.Has "secrets-store.csi.x-k8s.io/v1alpha1") }}
{{- $spc := .Values.secretProviderClass }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  {{- include "application.metadata" (dict "context" $ "name" $spc.name) | nindent 2 }}
spec:
  provider: {{ $spc.provider }}
  parameters:
    {{- with $spc.vaultAddress }}
    vaultAddress: {{ . }}
    {{- end }}
    roleName: {{ include "application.tplvalues.render" (dict "value" $spc.roleName "context" $) }}
    {{- with $spc.objects }}
    {{- /* The CSI driver expects `objects` as a string: accept either a ready made string or a list. */}}
    objects: |
      {{- (kindIs "string" . | ternary . (toYaml .)) | trim | nindent 6 }}
    {{- end }}
  {{- with $spc.secretObjects }}
  secretObjects:
    {{- range . }}
    - secretName: {{ .secretName }}
      type: {{ .type }}
      data:
        {{- toYaml .data | nindent 8 }}
    {{- end }}
  {{- end }}
{{- end }}
