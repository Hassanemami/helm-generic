{{- if and (.Values.sealedSecret).enabled (.Capabilities.APIVersions.Has "bitnami.com/v1alpha1") }}
{{- range $nameSuffix, $config := .Values.sealedSecret.files }}
{{- $name := printf "%s-%s" (include "application.name" $) $nameSuffix }}
{{- $labels := merge (dict) ($config.labels | default dict) ($.Values.sealedSecret.additionalLabels | default dict) }}
{{- $annotations := merge (dict) ($config.annotations | default dict) ($.Values.sealedSecret.annotations | default dict) }}
{{- if $config.clusterWide }}
  {{- $_ := set $annotations "sealedsecrets.bitnami.com/cluster-wide" "true" }}
{{- end }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  {{- include "application.metadata" (dict "context" $ "name" $name "labels" $labels "annotations" $annotations) | nindent 2 }}
spec:
  encryptedData:
    {{- toYaml $config.encryptedData | nindent 4 }}
  template:
    type: {{ default "Opaque" $config.type }}
    metadata:
      name: {{ $name }}
      namespace: {{ include "application.namespace" $ }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $labels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
