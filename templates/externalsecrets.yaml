{{- if (.Values.externalSecret).enabled }}
{{- $es := .Values.externalSecret }}
{{- range $nameSuffix, $data := $es.files }}
{{- $name := printf "%s-%s" (include "application.name" $) $nameSuffix }}
{{- if and (not $data.data) (not $data.dataFrom) }}
  {{- fail (printf "Data or dataFrom not specified for ExternalSecret %s" $name) }}
{{- end }}
---
{{- if $.Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret" }}
apiVersion: external-secrets.io/v1
{{- else }}
apiVersion: external-secrets.io/v1beta1
{{- end }}
kind: ExternalSecret
metadata:
  {{- include "application.metadata" (dict "context" $ "name" $name "labels" $es.additionalLabels "annotations" $es.annotations) | nindent 2 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ default $es.secretStore.name ($data.secretStore).name }}
    kind: {{ default $es.secretStore.kind ($data.secretStore).kind }}
  {{- with $data.data }}
  data:
    {{- range $secretKey, $remoteRef := . }}
    - secretKey: {{ $secretKey }}
      {{- toYaml $remoteRef | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with $data.dataFrom }}
  dataFrom:
    - extract:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  target:
    name: {{ $name }}
    template:
      {{- if ($data.target).template }}
      {{- include "application.tplvalues.render" (dict "value" $data.target.template "context" $) | nindent 6 }}
      {{- else }}
      type: {{ default "Opaque" $data.type }}
      {{- if or $data.annotations $data.labels }}
      metadata:
        {{- with $data.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $data.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end }}
