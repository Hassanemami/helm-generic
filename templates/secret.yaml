{{- if (.Values.secret).enabled }}
{{- range $nameSuffix, $file := .Values.secret.files }}
{{- /* `data` values are plain text and get base64 encoded, `encodedData` values are used as-is. */}}
{{- $data := dict }}
{{- range $key, $value := $file.data }}
  {{- $_ := set $data $key ($value | toString | b64enc) }}
{{- end }}
{{- $data = merge $data ($file.encodedData | default dict) }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "application.metadata" (dict "context" $ "name" (printf "%s-%s" (include "application.name" $) $nameSuffix) "labels" $.Values.secret.additionalLabels "annotations" $.Values.secret.annotations) | nindent 2 }}
{{- with $file.type }}
type: {{ . }}
{{- end }}
{{- with $data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with $file.stringData }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
