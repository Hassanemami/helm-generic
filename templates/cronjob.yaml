{{- if (.Values.cronJob).enabled }}
{{- range $name, $job := .Values.cronJob.jobs }}
---
{{- if $.Capabilities.APIVersions.Has "batch/v1/CronJob" }}
apiVersion: batch/v1
{{- else }}
apiVersion: batch/v1beta1
{{- end }}
kind: CronJob
metadata:
  {{- include "application.metadata" (dict "context" $ "name" $name "labels" $job.additionalLabels "annotations" $job.annotations) | nindent 2 }}
spec:
  schedule: {{ $job.schedule | quote }}
  {{- if $job.suspend }}
  suspend: true
  {{- end }}
  {{- if and $job.timeZone (semverCompare ">=1.27-0" $.Capabilities.KubeVersion.Version) }}
  timeZone: {{ $job.timeZone }}
  {{- end }}
  {{- with $job.concurrencyPolicy }}
  concurrencyPolicy: {{ . }}
  {{- end }}
  {{- if not (kindIs "invalid" $job.successfulJobsHistoryLimit) }}
  successfulJobsHistoryLimit: {{ $job.successfulJobsHistoryLimit }}
  {{- end }}
  {{- if not (kindIs "invalid" $job.failedJobsHistoryLimit) }}
  failedJobsHistoryLimit: {{ $job.failedJobsHistoryLimit }}
  {{- end }}
  jobTemplate:
    spec:
      {{- if not (kindIs "invalid" $job.startingDeadlineSeconds) }}
      startingDeadlineSeconds: {{ $job.startingDeadlineSeconds }}
      {{- end }}
      {{- if not (kindIs "invalid" $job.activeDeadlineSeconds) }}
      activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
      {{- end }}
      {{- if not (kindIs "invalid" $job.backoffLimit) }}
      backoffLimit: {{ $job.backoffLimit }}
      {{- end }}
      template:
        {{- include "application.jobPodTemplate" (dict "context" $ "name" $name "job" $job "class" "scheduled" "legacySecurityContext" "container") | nindent 8 }}
{{- end }}
{{- end }}
