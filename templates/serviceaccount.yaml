{{- if and .Values.rbac.enabled .Values.rbac.serviceAccount.enabled }}
{{- $sa := .Values.rbac.serviceAccount }}
{{- $annotations := merge (dict) ($sa.annotations | default dict) }}
{{- if .Values.deployment.openshiftOAuthProxy.enabled }}
  {{- $reference := include "application.sa.oauth-redirectreference" . | fromYaml }}
  {{- $_ := set $annotations "serviceaccounts.openshift.io/oauth-redirectreference.primary" (toRawJson $reference) }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "application.metadata" (dict "context" $ "name" (include "application.serviceAccountName" .) "labels" $sa.additionalLabels "annotations" $annotations) | nindent 2 }}
{{- end }}
