{{- if and (.Values.rbac).enabled .Values.rbac.roles }}
{{- range .Values.rbac.roles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- include "application.metadata" (dict "context" $ "name" (printf "%s-role-%s" (include "application.name" $) .name) "labels" $.Values.rbac.additionalLabels "annotations" $.Values.rbac.annotations) | nindent 2 }}
rules:
  {{- toYaml .rules | nindent 2 }}
{{- end }}
{{- end }}
